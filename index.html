<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <link rel="canonical" href="https://thomasdumas15-sudo.github.io/portfolio/">
  <meta name="theme-color" content="#111111">

  <!-- Partage (LinkedIn, WhatsApp, iMessage…) -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:site_name" content="Thomas Dumas">
  <meta property="og:title" content="Thomas Dumas — Portfolio">

  <meta property="og:url" content="https://thomasdumas15-sudo.github.io/portfolio/">

  <meta property="og:image:width" content="1800">
  <meta property="og:image:height" content="1350">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,800..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=2">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Thomas Dumas",
    "jobTitle": "Responsable communication, social media manager, photographe et vidéaste",
    "url": "https://thomasdumas15-sudo.github.io/portfolio/",
    "image": "https://thomasdumas15-sudo.github.io/portfolio/assets/img/cover-inside.jpg",
    "address": { "@type": "PostalAddress", "addressLocality": "Lyon", "addressCountry": "FR" },
    "sameAs": [
      "https://www.instagram.com/thomasdms_/",
      "https://www.linkedin.com/in/thomas-dumas-065230244"
    ]
  }
  </script>
</head>
<body>
  <a class="skip" href="#main">Aller au contenu</a>

  <header class="topbar">
    <a class="brand" href="#/">Thomas Dumas</a>
    <nav class="nav" aria-label="Navigation principale">
      <a href="#/" data-nav="home">Travaux</a>
      <a href="#/a-propos" data-nav="a-propos">À propos</a>
      <a href="#contact" class="nav__cta">Contact</a>
    </nav>
  </header>

  <main id="main" tabindex="-1">
    <noscript>
      <section class="hero">
        <h1 class="hero__name">Thomas Dumas</h1>
        <p class="hero__tagline">Responsable communication, social media manager, photographe et vidéaste. Activez JavaScript pour parcourir le portfolio.</p>
      </section>
    </noscript>
  </main>

  <footer class="footer" id="contact">
    <div class="footer__inner">
      <p class="footer__title">Travaillons ensemble.</p>
      <p class="footer__text">Une vidéo, une campagne photo, une stratégie réseaux sociaux ? Écrivez-moi, je réponds rapidement.</p>
      <ul class="pills" id="footer-links"></ul>
      <p class="footer__copy">© <span id="year"></span> Thomas Dumas · Lyon, France</p>
    </div>
  </footer>

  <button type="button" class="to-top" id="to-top" aria-label="Revenir en haut de la page">↑</button>

  <!-- Visionneuse photo -->
  <dialog class="lightbox" id="lightbox" aria-label="Visionneuse photo">
    <button class="lb-btn lb-close" data-lb="close" aria-label="Fermer (Échap)">✕</button>
    <button class="lb-btn lb-prev" data-lb="prev" aria-label="Photo précédente">←</button>
    <figure class="lb-figure"><img alt=""><figcaption class="lb-count"></figcaption></figure>
    <button class="lb-btn lb-next" data-lb="next" aria-label="Photo suivante">→</button>
  </dialog>

  <!-- Lecteur vidéo / Instagram -->
  <dialog class="player" id="player" aria-label="Lecteur">
    <button class="lb-btn lb-close" data-player="close" aria-label="Fermer (Échap)">✕</button>
    <div class="player__body">
      <div class="player__frame"></div>
      <a class="player__link" target="_blank" rel="noopener" hidden></a>
    </div>
  </dialog>

  <script src="assets/manifest.js?v=2" defer></script>
  <script src="content.js?v=2" defer></script>
  <script src="app.js?v=3" defer></script>
</body>
</html>
